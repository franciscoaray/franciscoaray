<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Flashcards interativos sobre Princípios da Óptica no Ambiente Residencial">
  <title>Óptica no Lar | Flashcards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="noise"></div>

  <header class="header">
    <div class="header-badge">Projeto Escolar</div>
    <h1 class="header-title">Princípios da <span class="highlight">Óptica</span></h1>
    <p class="header-subtitle">no Ambiente Residencial</p>
    <p class="header-desc">Clique nos cards para aprender sobre óptica no seu dia a dia</p>
  </header>

  <main>
    <div class="controls">
      <button class="btn btn-shuffle" id="shuffleBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        Embaralhar
      </button>
      <button class="btn btn-tts" id="ttsToggle" title="Alternar fonte de voz">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        <span id="ttsLabel">Polly IA</span>
      </button>
      <div class="voice-selector">
        <select id="backendSelect" class="voice-select" aria-label="API de voz"></select>
        <select id="voiceSelect" class="voice-select" aria-label="Selecionar voz"></select>
      </div>
      <div class="progress">
        <span class="progress-label">Explorados</span>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="progress-count" id="progressCount">0 / 10</span>
      </div>
    </div>

    <div class="cards-grid" id="cardsGrid"></div>
  </main>

  <footer class="footer">
    <p>Projeto Escolar &mdash; Princípios da Óptica no Ambiente Residencial</p>
    <p class="footer-voice" id="voiceInfo"></p>
  </footer>

  <div class="toast" id="toast"></div>

  <script src="js/cards.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
